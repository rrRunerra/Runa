services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
        - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL}
        - NEXTAUTH_URL=${NEXTAUTH_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEST_PORT=${NEST_PORT}
        - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    container_name: runa-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NEST_API_URL=http://backend:${NEST_PORT:-4000}
      - NEXTAUTH_URL_INTERNAL=http://localhost:3000
      - LYNX_API_URL=http://lynx-bot:4444
    restart: always

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: runa-backend
    ports:
      - "${NEST_PORT}:${NEST_PORT}"
    env_file:
      - .env
    environment:
      - UPLOAD_DIR=/app/uploads
    volumes:
      - runa-backend-uploads:/app/uploads
    restart: always

volumes:
  runa-backend-uploads:

  lynx-bot:
    build:
      context: .
      dockerfile: apps/lynx-bot/Dockerfile
    container_name: runa-lynx-bot
    ports:
      - "${LYNX_PORT}:${LYNX_PORT}"
    env_file:
      - .env
    restart: always
