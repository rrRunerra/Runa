services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - DATABASE_URL
    container_name: runa-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: runa-backend
    ports:
      - "${NEST_PORT}:${NEST_PORT}"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-rrAkaryth}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-runerra}
    restart: always

  lynx-bot:
    build:
      context: .
      dockerfile: apps/lynx-bot/Dockerfile
    container_name: runa-lynx-bot
    ports:
      - "${LYNX_PORT}:${LYNX_PORT}"
    env_file:
      - .env
    restart: always
