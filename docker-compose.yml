services:
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        - DATABASE_URL=${DATABASE_URL}
        - NEXT_PUBLIC_URL=${NEXT_PUBLIC_URL}
        - NEXTAUTH_URL=${NEXTAUTH_URL}
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEST_PORT=${NEST_PORT}
    container_name: runa-frontend
    ports:
      - "3000:3000"
    env_file:
      - .env
    restart: always

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: runa-backend
    ports:
      - "${NEST_PORT}:${NEST_PORT}"
    env_file:
      - .env
    restart: always

  lynx-bot:
    build:
      context: .
      dockerfile: apps/lynx-bot/Dockerfile
    container_name: runa-lynx-bot
    ports:
      - "${LYNX_PORT}:${LYNX_PORT}"
    env_file:
      - .env
    restart: always
